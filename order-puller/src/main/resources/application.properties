spring.application.name=order-puller
server.port=9292

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Admin123!

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=localhost:9092
order.poller.topic.name=unprocessed-order-events
order.poller.fixed-delay-ms=2000
order.poller.batch-size=50
order.poller.max-retries=5

management.endpoints.web.exposure.include=health,info
